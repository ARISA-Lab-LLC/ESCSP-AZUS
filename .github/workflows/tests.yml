name: tests

# Run the full unittest suite on every push and pull request.  The suite
# is deterministic and offline (no Zenodo credentials required) — see
# tests/ and the "Running the tests" section of README.md.

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -r requirements-standalone.txt
      - name: Run test suite
        run: python3 -m unittest discover -s tests -v
